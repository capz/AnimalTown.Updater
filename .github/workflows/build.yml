name: Build updater
on:
  push:
    branches: [main, feat/updater]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python3 tools/build.py --backend Docker
      - uses: actions/upload-artifact@v4
        with:
          name: animal-town-updater
          path: out/release/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: animal-town-updater
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "updater-${GITHUB_SHA:0:12}" --repo "$GITHUB_REPOSITORY" --prerelease --title "AnimalTown updater ${GITHUB_SHA:0:12}" --notes 'Development updater. GC Loader/BBA/Swiss hardware acceptance remains required.' release/*
